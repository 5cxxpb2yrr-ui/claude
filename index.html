<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS Mission Control</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0e1626;--card2:#131d33;--line:#22304d;--tx:#eaf0ff;--mu:#8c9cbd;--blue:#2f7bff;--amber:#f5a524;--green:#2ed38a;--red:#ff5d5d;--pink:#ff7a93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 40% at 50% 0,#0e2150 0,var(--bg) 60%) no-repeat var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;padding:12px 14px 150px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.logo{font-size:28px;font-weight:700;letter-spacing:-.5px}.logo b{color:var(--blue)}
.sub{color:var(--mu);font-size:16px}.tag{color:var(--mu);font-size:13px;margin-top:8px}
.date{text-align:right;color:var(--mu);font-size:13px}.date em{display:block;font-style:normal;font-size:12px;color:var(--green);margin-top:2px}.date em.w{color:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.hero{border-color:#2a5bd0;background:linear-gradient(180deg,#0f1f45,var(--card));box-shadow:0 0 24px #2f7bff33}
.risk{border-color:#6b4a14;background:linear-gradient(180deg,#2a1c0a,var(--card))}
.rel{border-color:#6b2a38;background:linear-gradient(180deg,#2a1018,var(--card))}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:8px}
.hd .pill{font-weight:500;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mu);background:#0a1120}
.c-blue{color:#5ea0ff}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-pink{color:var(--pink)}.c-mu{color:var(--mu)}
.row{display:flex;gap:12px;align-items:center}
.ico{flex:none;width:48px;height:48px;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px}
.ico.big{width:68px;height:68px;background:#fff;border:0}
h3{margin:0;font-size:17px;font-weight:600;line-height:1.2}.hero h3{font-size:20px}
.s{color:var(--mu);font-size:13px;margin-top:2px}.s.hot{color:var(--red)}
.mets{display:flex;gap:16px;margin-top:8px}
.m small{display:block;color:var(--mu);font-size:11px}.m b{display:flex;align-items:center;gap:5px;font-size:16px}
.r{width:22px;height:22px}
.facts{margin:10px 0}.fact{display:flex;gap:10px;margin-bottom:8px;font-size:13px}.fact i{font-style:normal;color:#5ea0ff;width:22px;text-align:center}.fact small{display:block;color:var(--mu)}
.btns{display:flex;gap:8px;margin-top:10px}
.b{flex:1;padding:11px 8px;border-radius:12px;background:#15213a;border:1px solid var(--line);font-weight:600;font-size:14px;min-height:44px}
.b.p{background:var(--blue);border-color:var(--blue)}.b.sm{flex:none;padding:8px 14px;min-height:40px}.b.ic{flex:none;width:56px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}.grid .card:only-child{grid-column:1/-1}
.grid h3{font-size:16px}.grid .row{align-items:flex-start;gap:9px}.grid .ico{width:42px;height:42px;font-size:19px}
.q{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;text-align:left;padding:9px 0;border-top:1px solid #17233b;font-size:13.5px;min-height:40px}.q span{color:var(--mu);font-size:12px}.q.d b{text-decoration:line-through;color:var(--mu);font-weight:400}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.ok{background:#0d2a1f;border-color:#1b6a4a;text-align:center;color:var(--green);padding:16px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#0a1020ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:4px 0;position:relative;min-height:46px}nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}nav button.on{color:var(--blue)}
nav .dot{position:absolute;top:2px;left:57%;width:9px;height:9px;border-radius:50%;background:var(--red)}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--blue);font-size:28px;box-shadow:0 6px 20px #2f7bff66;z-index:5}
.ov{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:11;max-height:80vh;overflow-y:auto}.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
input{width:100%;background:#0a1120;border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font:inherit;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b2a48;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.li{padding:11px 0;border-top:1px solid #17233b;display:flex;justify-content:space-between;gap:10px;align-items:center}
h2{font-size:20px;margin:6px 0 12px}h4{margin:14px 0 6px;color:var(--mu);font-size:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#0a1120;color:var(--mu)}.chip.hi{color:var(--red);border-color:#6b2a38}.crumbs{font-size:12px;color:var(--mu);margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:2px}.crumbs button{background:none;color:#5ea0ff;padding:4px 3px;min-height:32px}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Capture">+</button>
<nav id="nav"></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let ITEMS=[
{id:'gp',k:'next',t:'Contact Georgia Power',s:'regarding service transfer.',i:92,c:88,out:'Prevent utility interruption for your upcoming move and avoid late fees.',why:'Your move date is in 6 days. No transfer request is currently open.',ent:'Georgia Power',acts:['Call Now','Start Online']},
{id:'reg',k:'exec',t:'Renew Vehicle Registration',s:'Expires in 4 days',hot:1,i:84,c:97,out:'Stay legal and avoid late penalties.',why:'Registration expires in 4 days.',ent:'Vehicle',acts:['Complete']},
{id:'ins',k:'dec',t:'Choose Insurance Plan',s:'Enrollment closes in 12 days',i:91,c:82,out:'Lock in coverage before enrollment closes.',why:'Three plans are available; none selected yet.',ent:'Insurance',acts:['Review Options']},
{id:'esc',k:'risk',t:'Mortgage Escrow Shortfall',s:'Monthly payment may increase by $172.',i:96,c:94,out:'Know the new payment before it takes effect.',why:'The escrow account is projected to fall short.',ent:'Mortgage servicer',acts:['Review','Contact Servicer']},
{id:'con',k:'wait',t:'Contract Signature',s:'Waiting on vendor',s2:'Expected response in 3 days',i:60,c:90,out:'Signed contract on file.',why:'Vendor has the document; nothing needed from you.',ent:'Vendor',acts:['View Details']},
{id:'ref',k:'opp',t:'Refinance Auto Loan',s:'Potential savings',s2:'$1,840 annually',i:88,c:77,out:'Lower your monthly auto payment.',why:'Current rate is above recent offers.',ent:'Vehicle',acts:['Explore']},
{id:'sar',k:'rel',t:'Sarah Johnson',s:'No communication in 42 days',rec:'Schedule a catch-up call.',i:86,c:81,out:'Reconnect before the gap grows.',why:'Longest gap among your close contacts.',ent:'Sarah Johnson',acts:['Schedule']}];
const TYPE={'Georgia Power':'Utility','Vehicle':'Asset','Insurance':'Account','Mortgage servicer':'Account','Vendor':'Contract','Sarah Johnson':'Person'};
const DEF={done:{},snooze:{},rev:{},inbox:['Call movers about Saturday slot','Scan HOA letter'],tab:'mission'};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('lifeos')||'{}'))}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem('lifeos',JSON.stringify(S))}catch(e){}};
let QUEUE=[['Review Tax Return Draft','Due next week'],['Review Estate Planning Documents','Last reviewed 18 months ago'],['Review Emergency Fund Allocation','No recent review']];
const live=x=>!S.done[x.id]&&!S.snooze[x.id];const hero=()=>ITEMS.filter(live).sort((a,b)=>(b.i*b.c+(b.k==='next'?1e4:0))-(a.i*a.c+(a.k==='next'?1e4:0)))[0];const open=k=>ITEMS.filter(x=>x.k===k&&live(x)&&x!==hero());
const col=v=>v>=95?'var(--red)':v>=90?'var(--amber)':'var(--green)';
const ring=(v,c)=>`<svg class="r" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#26334f" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${v*.5655} 100" transform="rotate(-90 12 12)"/></svg>`;
const mets=x=>`<div class="mets"><div class="m"><small>Impact</small><b>${ring(x.i,col(x.i))}${x.i}</b></div><div class="m"><small>Confidence</small><b>${ring(x.c,'#9fb0d0')}${x.c}%</b></div></div>`;
const logo='<svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 4 36 34H4z" fill="#e4262c"/><path d="M20 4 36 34H20z" fill="#1d63d8"/><path d="M4 34h32l-6-9z" fill="#17b26a"/></svg>';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function sheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+crumbs()+h;$('#sheet').classList.add('on');$('#ov').classList.add('on')}
function close(){CR=[];$('#sheet').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=close;
function resolve(id,label){const bi=ITEMS.find(i=>i.id===id);if(bi&&bi.bill){return label==='Open bill'?bill(bi.bill):payForm(bi.bill)}S.done[id]=1;save();close();toast(label+' · done');render()}
function detail(id){const x=ITEMS.find(i=>i.id===id);C(0,x.t.replace(/<[^>]+>/g,'').slice(0,22),()=>detail(id));
 sheet(`<h2>${x.t}</h2><div class="s">${x.s} ${x.s2||''}</div>${mets(x)}<div class="facts" style="margin-top:14px"><div class="fact"><i>◎</i><div><small>Expected outcome</small>${x.out}</div></div><div class="fact"><i>▤</i><div><small>Why this matters</small>${x.why}</div></div></div>
 <div class="btns">${x.acts.map((a,n)=>`<button class="b ${n?'':'p'}" onclick="resolve('${x.id}','${a}')">${a}</button>`).join('')}</div>
 <div class="btns"><button class="b" onclick="S.snooze['${x.id}']=1;save();close();toast('Snoozed for a day');render()">Snooze 1 day</button></div>${x.bill?`<div class="btns"><button class="b" onclick="bill('${x.bill}')">Open bill account</button></div>`:''}`)}
function act(id,label){label==='Complete'?resolve(id,label):detail(id)}
const btn=(x,wide)=>x.acts.slice(0,1).map(a=>`<button class="b ${a==='Complete'||a==='Call Now'?'p':''}" onclick="act('${x.id}','${a}')">${a}</button>`).join('');
function mission(){
 const nx=hero()||null;
 const crit=ITEMS.filter(x=>!S.done[x.id]&&!S.snooze[x.id]&&x.i>=95).length;
 const d=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 let h=`<header><div><div class="logo">Life<b>OS</b></div><div class="sub">Mission Control</div><div class="tag">A calmer, more intentional life.<br>One decision at a time.</div></div><div class="date">${d}<em class="${crit?'w':''}">● ${crit?crit+' critical open':'You’re on track.'}</em></div></header>`;
 if(nx)h+=`<div class="card hero"><div class="hd"><span class="c-blue">✦ NEXT BEST ACTION</span><span class="pill">High impact ›</span></div><div class="row" onclick="detail('${nx.id}')"><div class="ico big">${nx.id==='gp'?logo:'<span style="font-size:34px">'+(nx.ic||'✦')+'</span>'}</div><div><h3>${nx.t}</h3><div class="s" style="font-size:14px">${nx.s}</div>${mets(nx)}</div></div><div class="facts"><div class="fact"><i>◎</i><div><small>Expected outcome</small>${nx.out}</div></div><div class="fact"><i>▤</i><div><small>Why this matters</small>${nx.why}</div></div></div><div class="btns"><button class="b p" onclick="act('${nx.id}','${nx.acts[0]}')">${nx.acts[0]}</button>${nx.acts[1]?`<button class="b" onclick="act('${nx.id}','${nx.acts[1]}')">${nx.acts[1]}</button>`:''}<button class="b ic" onclick="detail('${nx.id}')">•••</button></div></div>`;
 const small=(x,ic,cls,hd,sub)=>`<div class="card"><div class="hd ${cls}" onclick="listK('${x.k}')"><span>${hd}</span><span class="c-mu">›</span></div><div class="row" onclick="detail('${x.id}')"><div class="ico">${ic}</div><div><h3>${x.t}</h3><div class="s ${x.hot?'hot':''}">${sub}</div></div></div>${mets(x)}<div class="btns">${btn(x)}</div></div>`;
 const g=(a)=>a.length?`<div class="grid">${a.join('')}</div>`:'';
 h+=g([...open('exec').slice(0,1).map(x=>small(x,x.ic||'🚗','c-amber','⚡ EXECUTE NOW'+more1('exec'),x.s)),...open('dec').slice(0,1).map(x=>small(x,x.ic||'🛡','c-blue','⚇ DECISIONS REQUIRED'+more1('dec'),x.s))]);
 open('risk').forEach(x=>h+=`<div class="card risk"><div class="hd"><span class="c-amber">⚠ AT RISK</span><span class="pill" style="color:var(--red)">${crit} critical</span></div><div class="row" onclick="detail('${x.id}')"><div class="ico">${x.ic||'🏠'}</div><div><h3>${x.t}</h3><div class="s">${x.s}</div>${mets(x)}</div></div><div class="btns"><button class="b" onclick="detail('${x.id}')">Review</button><button class="b" onclick="resolve('${x.id}','Handled')">${x.acts[1]||'Mark handled'}</button></div></div>`);
 h+=g([...open('wait').slice(0,1).map(x=>`<div class="card"><div class="hd c-mu" onclick="listK('wait')"><span>⏳ WAITING${more1('wait')}</span><span>›</span></div><div class="row" onclick="detail('${x.id}')"><div class="ico">📄</div><div><h3>${x.t}</h3><div class="s">${x.s}</div><div class="s">${x.s2}</div></div></div><div class="btns">${btn(x)}</div></div>`),
  ...open('opp').map(x=>`<div class="card"><div class="hd c-green"><span>🌱 OPPORTUNITIES</span><span class="c-mu">›</span></div><div class="row" onclick="detail('${x.id}')"><div class="ico">📊</div><div><h3>${x.t}</h3><div class="s">${x.s}</div><div class="s c-green" style="font-size:15px;font-weight:600">${x.s2}</div></div></div>${mets(x)}<div class="btns">${btn(x)}</div></div>`)]);
 open('rel').forEach(x=>h+=`<div class="card rel"><div class="hd c-pink"><span>♥ RELATIONSHIP REPAIRS</span><span class="c-mu">›</span></div><div class="row" onclick="detail('${x.id}')"><div class="ico" style="border-radius:50%;background:#3a2530">${x.t.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><div style="flex:1"><h3 style="font-size:16px">${x.t}</h3><div class="s">${x.s}</div></div><button class="b sm" onclick="event.stopPropagation();act('${x.id}','Schedule')">Schedule</button></div><div class="s" style="margin-top:8px">Recommendation: ${x.rec}</div>${mets(x)}</div>`);
 const left=QUEUE.filter((q,n)=>!S.rev[n]).length;
 h+=`<div class="card"><div class="hd"><span class="c-mu">☰ REVIEW QUEUE</span><span class="pill">${left} items</span></div>${QUEUE.map((q,n)=>`<button class="q ${S.rev[n]?'d':''}" onclick="S.rev[${n}]=!S.rev[${n}];save();render()"><b>${q[0]}</b><span>${S.rev[n]?'Reviewed':q[1]}</span></button>`).join('')}</div>`;
 if(!ITEMS.some(x=>!S.done[x.id]&&!S.snooze[x.id]))h+='<div class="card ok">Everything is handled. Enjoy the calm.</div>';
 return h}
function inbox(){return `<h2>Inbox</h2>${S.inbox.length?S.inbox.map((t,n)=>`<div class="card li" style="margin-bottom:8px"><span>${capHtml(t)}</span><button class="b sm" onclick="arch(${n})">Archive</button></div>`).join(''):'<div class="empty">Inbox is clear. Tap + to capture a thought, bill, or task.</div>'}${archHtml()}`}
function entities(){const m={};ITEMS.forEach(x=>(m[x.ent]=m[x.ent]||[]).push(x));
 return '<h2>Entities</h2>'+billsList()+['Person','Asset','Account','Utility','Contract'].map(t=>{const e=Object.keys(m).filter(k=>(TYPE[k]||'Account')===t);return e.length?`<h4>${t}s</h4>`+e.map(k=>`<button class="card li" style="width:100%;text-align:left;margin-bottom:8px" onclick="ent('${k}')"><span>${k}</span><span class="c-mu">${m[k].filter(x=>!S.done[x.id]).length} open ›</span></button>`).join(''):''}).join('')}
function ent(k){C(0,k,()=>ent(k));const L=ITEMS.filter(x=>x.ent===k);sheet(`<h2>${k}</h2>`+L.map(x=>`<button class="li" style="width:100%;background:none;text-align:left" onclick="detail('${x.id}')"><span>${x.t}<div class="s">${S.done[x.id]?'Done':x.s}</div></span><span class="c-mu">›</span></button>`).join(''))}
let Q='';
function search(){const r=ITEMS.filter(x=>(x.t+x.s+x.ent).toLowerCase().includes(Q.toLowerCase()));
 return `<h2>Search</h2><input id="q" placeholder="Search actions, people, accounts" value="${Q.replace(/"/g,'&quot;')}" oninput="Q=this.value;const p=this.selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)">`+`<div style="margin-top:12px">${r.map(x=>`<button class="card li" style="width:100%;text-align:left;margin-bottom:8px" onclick="detail('${x.id}')"><span>${x.t}<div class="s">${S.done[x.id]?'Done':x.s}</div></span><span class="c-mu">›</span></button>`).join('')||'<div class="empty">No matches. Try a person or account name.</div>'}</div>`}
function more(){return `<h2>More</h2>${dataCard()}<div class="card"><h3>Done today</h3><div class="s">${Object.keys(S.done).length} of ${ITEMS.length} actions resolved</div></div><div class="card"><h3>Reset demo data</h3><div class="s">Restore every action, inbox note, and review item.</div><div class="btns"><button class="b" onclick="S={...DEF,done:{},snooze:{},rev:{},inbox:[...DEF.inbox]};save();toast('Reset');render()">Reset</button></div></div>`}
function render(){const T={mission,inbox,entities,search,more};$('#app').innerHTML=T[S.tab]();$('#fab').style.display=S.tab==='mission'||S.tab==='inbox'?'block':'none';
 $('#nav').innerHTML=[['mission','⌂','Mission'],['inbox','✉','Inbox'],['entities','⚇','Entities'],['search','⌕','Search'],['more','⋯','More']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';save();render();scrollTo(0,0)"><i>${i}</i>${l}${k==='inbox'&&S.inbox.length?'<span class="dot"></span>':''}</button>`).join('')}
$('#fab').onclick=()=>{sheet('<h2>Capture</h2><input id="cap" placeholder="Call @Marcus p2 *phone ^mentorship" autocomplete="off" oninput="chips(this.value)"><div id="chips" class="chips"></div><div class="s" style="margin-top:6px">p1–p5 priority · *context · @person · &gt;project · ^goal · #tracker(value)</div><div class="btns"><button class="b p" id="capgo">Save to Inbox</button></div>');setTimeout(()=>$('#cap').focus(),250);
 const go=()=>{const v=$('#cap').value.trim();if(!v)return;S.inbox.unshift(v);save();close();toast('Captured');render()};$('#capgo').onclick=go;$('#cap').onkeydown=e=>{if(e.key==='Enter')go()}};
